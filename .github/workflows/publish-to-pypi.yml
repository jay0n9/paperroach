name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: python -m pip install build==1.6.0 twine==7.0.0

      - name: Verify tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected_tag = f"v{project['version']}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match package version {expected_tag!r}."
              )
          PY

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel --outdir dist

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify distribution set and archive paths
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile
          from pathlib import PurePosixPath

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist, found {len(wheels)} wheel(s) "
                  f"and {len(sdists)} sdist(s)."
              )

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_members = archive.namelist()
          with tarfile.open(sdists[0], mode="r:gz") as archive:
              sdist_members = archive.getnames()

          for archive_name, members in (
              (wheels[0].name, wheel_members),
              (sdists[0].name, sdist_members),
          ):
              unsafe = []
              for member in members:
                  path = PurePosixPath(member)
                  if path.is_absolute() or ".." in path.parts:
                      unsafe.append(member)
              if unsafe:
                  raise SystemExit(f"Unsafe archive paths in {archive_name}: {unsafe}")

          if not any(member.startswith("kb/") for member in wheel_members):
              raise SystemExit("The wheel does not contain the kb package.")
          if not any(member.startswith("paperroach/") for member in wheel_members):
              raise SystemExit("The wheel does not contain the paperroach package.")
          PY

      - name: Smoke test the wheel
        run: python scripts/smoke_wheel.py dist

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/paperroach
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
